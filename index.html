<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ludovica Sidoti - Personal Website">
    <title>Ludovica Sidoti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        main {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        section {
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        section h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        section p {
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .contact-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .contact-links a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .contact-links a:hover {
            background: #5568d3;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            main {
                margin: 2rem auto;
            }

            section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ludovica Sidoti</h1>
        <p>Welcome to my personal website</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>Welcome! I'm Ludovica Sidoti.</p>
            <p>This is my personal website. More information coming soon.</p>
        </section>

        <section>
            <h2>Contact</h2>
            <p>Feel free to reach out to me:</p>
            <div class="contact-links">
                <a href="mailto:contact@example.com">Email</a>
                <a href="https://github.com/davidorban/ludovicasidoti" target="_blank">GitHub</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ludovica Sidoti. All rights reserved.</p>
    </footer>
</body>
</html>
